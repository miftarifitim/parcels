<!DOCTYPE html>
<html lang="sq"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regjistrues Parcelash</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6b3a">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f2efe6;--ink:#1d2a1f;--mut:#5d6b5f;--card:#fff;--go:#1f6b3a;--rec:#c2410c;--line:#cfcab8}
@media(prefers-color-scheme:dark){:root{--bg:#141a15;--ink:#eef1e8;--mut:#9aa89c;--card:#1e271f;--go:#3d9b5c;--rec:#e8743a;--line:#334036}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 14px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:16px;width:100%;margin:6px 0;background:var(--go);color:#fff}
button.rec{background:var(--rec);padding:30px 16px;font-size:20px}
button.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.sm{width:auto;padding:9px 14px;margin:0 6px 0 0;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:14px}
pre{white-space:pre-wrap;word-break:break-all;font:13px/1.5 ui-monospace,monospace;margin:8px 0;max-height:220px;overflow:auto}
input{font:inherit;width:100%;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.pt{display:flex;justify-content:space-between;font:14px ui-monospace,monospace;padding:6px 0;border-bottom:1px solid var(--line)}
.hide{display:none}
</style></head><body>

<section id="home">
  <h1>Parcelat</h1>
  <button onclick="newParcel()">Parcelë e re</button>
  <div id="list"></div>
</section>

<section id="rec" class="hide">
  <h1 id="rtitle">Parcelë e re</h1>
  <input id="pname" placeholder="Emri i parcelës">
  <button class="rec" id="recbtn" onclick="record()">Regjistro koordinatën</button>
  <div class="card hide" id="live"><b id="lt"></b><div class="mut" id="ld"></div><button class="sec" onclick="finish()">Prano tani</button></div>
  <div class="mut" id="status">Pika të regjistruara: 0</div>
  <div class="card" id="pts"></div>
  <button onclick="save()">Ruaj koordinatat</button>
  <button class="sec" onclick="undo()">Hiq pikën e fundit</button>
  <button class="sec" onclick="cancel()">Anulo</button>
</section>

<script>
const KEY='parcels_v1',WINDOW=20000,GOOD=5;
let parcels=[],cur=null,orig=0,watch=null,tmr=null,reads=[],t0=0;
try{parcels=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const $=id=>document.getElementById(id);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(parcels))}catch(e){}};
const show=v=>{$('home').classList.toggle('hide',v!=='home');$('rec').classList.toggle('hide',v!=='rec')};

function toText(p){
  return p.name+' ('+p.date+') WGS84\nPoint,Lat,Lon,Acc_m,Readings\n'+
    p.points.map((q,i)=>(i+1)+','+q.lat.toFixed(8)+','+q.lon.toFixed(8)+','+q.acc.toFixed(1)+','+(q.n||1)).join('\n');
}
function render(){
  $('list').innerHTML=parcels.length?'':'<p class="mut">Nuk ka parcela ende. Shtyp "Parcelë e re" për të filluar.</p>';
  parcels.slice().reverse().forEach(p=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML='<b></b><div class="mut">'+p.points.length+' pika · '+p.date+'</div><pre></pre>';
    d.querySelector('b').textContent=p.name;
    d.querySelector('pre').textContent=toText(p);
    const row=document.createElement('div');
    [['Vazhdo',()=>edit(p.id)],['Kopjo',()=>copy(p)],['Ndaj',()=>share(p)],['Fshij',()=>del(p.id)]].forEach(([t,f])=>{
      const b=document.createElement('button');b.className='sm sec';b.style.marginBottom='6px';b.textContent=t;b.onclick=f;row.appendChild(b)});
    d.appendChild(row);$('list').appendChild(d);
  });
}
async function copy(p){
  try{await navigator.clipboard.writeText(toText(p));alert('U kopjua. Ngjite në Viber ose WhatsApp.')}
  catch(e){const t=document.createElement('textarea');t.value=toText(p);document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('U kopjua.')}
}
function share(p){if(navigator.share)navigator.share({title:p.name,text:toText(p)}).catch(()=>{});else copy(p)}
function del(id){if(confirm('Të fshihet kjo parcelë?')){parcels=parcels.filter(p=>p.id!==id);persist();render()}}

function open_(){draw();show('rec');window.scrollTo(0,0)}
function newParcel(){cur={id:Date.now(),points:[]};orig=0;$('pname').value='';$('rtitle').textContent='Parcelë e re';open_()}
function edit(id){const p=parcels.find(x=>x.id===id);cur=JSON.parse(JSON.stringify(p));orig=cur.points.length;$('pname').value=cur.name;$('rtitle').textContent='Vazhdo parcelën';open_()}
function cancel(){stop();if(cur.points.length===orig||confirm('Të hidhen poshtë ndryshimet?')){cur=null;show('home')}}
function draw(){
  $('status').textContent='Pika të regjistruara: '+cur.points.length;
  $('pts').innerHTML=cur.points.length?cur.points.map((q,i)=>
    '<div class="pt"><span>'+(i+1)+'</span><span>'+q.lat.toFixed(7)+', '+q.lon.toFixed(7)+'</span><span>±'+q.acc.toFixed(1)+'m</span></div>').join('')
    :'<span class="mut">Qëndro në një kënd dhe shtyp "Regjistro koordinatën".</span>';
}

// Averaged fix: collect GPS readings for up to 20 s, keep the best ones, weight by 1/acc^2
function record(){
  if(!navigator.geolocation){alert('GPS nuk është i disponueshëm');return}
  reads=[];t0=Date.now();
  $('recbtn').disabled=true;$('recbtn').textContent='Po mesatarizohet… mos lëviz';
  $('live').classList.remove('hide');$('lt').textContent='Po pritet GPS…';$('ld').textContent='';
  watch=navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords;reads.push({lat:c.latitude,lon:c.longitude,acc:c.accuracy||99});
    const best=Math.min(...reads.map(r=>r.acc));
    $('lt').textContent='Saktësia më e mirë ±'+best.toFixed(1)+' m';
    $('ld').textContent=reads.length+' matje · '+Math.max(0,Math.ceil((WINDOW-(Date.now()-t0))/1000))+' s mbeten';
    if(reads.length>=12&&best<=GOOD&&Date.now()-t0>8000)finish();
  },err=>{stop();alert('Nuk u gjet sinjal GPS: '+err.message+'. Kontrollo lejen e vendndodhjes dhe provo jashtë.')},
  {enableHighAccuracy:true,timeout:30000,maximumAge:0});
  tmr=setTimeout(finish,WINDOW);
}
function stop(){
  if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;
  clearTimeout(tmr);tmr=null;
  $('live').classList.add('hide');$('recbtn').disabled=false;$('recbtn').textContent='Regjistro koordinatën';
}
function finish(){
  const r=reads.slice();stop();
  if(!r.length){alert('Nuk u morën matje. Provo përsëri.');return}
  const best=Math.min(...r.map(x=>x.acc));
  const use=r.filter(x=>x.acc<=Math.max(best*1.5,best+2));   // drop poor readings
  let w=0,la=0,lo=0;
  use.forEach(x=>{const k=1/(x.acc*x.acc);w+=k;la+=x.lat*k;lo+=x.lon*k});
  const acc=best; // report best single-reading accuracy (conservative)
  cur.points.push({lat:la/w,lon:lo/w,acc:acc,n:use.length});
  draw();
  if(acc>10)alert('Saktësia vetëm ±'+acc.toFixed(0)+' m. Hiqe këtë pikë dhe rimati në hapësirë të hapur, larg mureve dhe pemëve.');
}
function undo(){cur.points.pop();draw()}
function save(){
  stop();
  if(cur.points.length<3&&!confirm('Më pak se 3 pika. Të ruhet prapë?'))return;
  cur.name=$('pname').value.trim()||('Parcela '+(parcels.length+1));
  if(!cur.date||!orig)cur.date=new Date().toLocaleString();
  const i=parcels.findIndex(p=>p.id===cur.id);
  if(i>=0)parcels[i]=cur;else parcels.push(cur);
  persist();cur=null;render();show('home');
}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
