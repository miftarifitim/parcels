<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parcel Recorder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6b3a">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f2efe6;--ink:#1d2a1f;--mut:#5d6b5f;--card:#fff;--go:#1f6b3a;--rec:#c2410c;--line:#cfcab8}
@media(prefers-color-scheme:dark){:root{--bg:#141a15;--ink:#eef1e8;--mut:#9aa89c;--card:#1e271f;--go:#3d9b5c;--rec:#e8743a;--line:#334036}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 14px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:16px;width:100%;margin:6px 0;background:var(--go);color:#fff}
button.rec{background:var(--rec);padding:30px 16px;font-size:20px}
button.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.sm{width:auto;padding:9px 14px;margin:0 6px 0 0;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:14px}
pre{white-space:pre-wrap;word-break:break-all;font:13px/1.5 ui-monospace,monospace;margin:8px 0;max-height:220px;overflow:auto}
input{font:inherit;width:100%;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.pt{display:flex;justify-content:space-between;font:14px ui-monospace,monospace;padding:6px 0;border-bottom:1px solid var(--line)}
.hide{display:none}
</style></head><body>

<section id="home">
  <h1>Parcels</h1>
  <button onclick="newParcel()">New parcel</button>
  <div id="list"></div>
</section>

<section id="rec" class="hide">
  <h1 id="rtitle">New parcel</h1>
  <input id="pname" placeholder="Parcel name (optional)">
  <button class="rec" id="recbtn" onclick="record()">Record coordinate</button>
  <div class="mut" id="status">Points recorded: 0</div>
  <div class="card" id="pts"></div>
  <button onclick="save()">Save coordinates</button>
  <button class="sec" onclick="undo()">Remove last point</button>
  <button class="sec" onclick="cancel()">Cancel</button>
</section>

<script>
const KEY='parcels_v1';
let parcels=[],cur=null;
try{parcels=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const $=id=>document.getElementById(id);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(parcels))}catch(e){}};
const show=v=>{$('home').classList.toggle('hide',v!=='home');$('rec').classList.toggle('hide',v!=='rec')};

function toText(p){
  // Format: Name, then Point,Lat,Lon,Accuracy_m (WGS84, decimal degrees)
  return p.name+' ('+p.date+') WGS84\nPoint,Lat,Lon,Acc_m\n'+
    p.points.map((q,i)=>(i+1)+','+q.lat.toFixed(7)+','+q.lon.toFixed(7)+','+q.acc.toFixed(1)).join('\n');
}
function render(){
  $('list').innerHTML=parcels.length?'':'<p class="mut">No parcels yet. Tap New parcel to start.</p>';
  parcels.slice().reverse().forEach(p=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML='<b></b><div class="mut">'+p.points.length+' points · '+p.date+'</div><pre></pre>';
    d.querySelector('b').textContent=p.name;
    d.querySelector('pre').textContent=toText(p);
    const row=document.createElement('div');
    [['Copy',()=>copy(p)],['Share',()=>share(p)],['Delete',()=>del(p.id)]].forEach(([t,f])=>{
      const b=document.createElement('button');b.className='sm sec';b.textContent=t;b.onclick=f;row.appendChild(b)});
    d.appendChild(row);$('list').appendChild(d);
  });
}
async function copy(p){
  try{await navigator.clipboard.writeText(toText(p));alert('Copied. Paste it into Viber or WhatsApp.')}
  catch(e){const t=document.createElement('textarea');t.value=toText(p);document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Copied.')}
}
function share(p){
  if(navigator.share)navigator.share({title:p.name,text:toText(p)}).catch(()=>{});
  else copy(p);
}
function del(id){if(confirm('Delete this parcel?')){parcels=parcels.filter(p=>p.id!==id);persist();render()}}

function newParcel(){cur={id:Date.now(),points:[]};$('pname').value='';draw();show('rec')}
function cancel(){if(!cur.points.length||confirm('Discard this parcel?')){cur=null;show('home')}}
function draw(){
  $('status').textContent='Points recorded: '+cur.points.length;
  $('pts').innerHTML=cur.points.length?cur.points.map((q,i)=>
    '<div class="pt"><span>'+(i+1)+'</span><span>'+q.lat.toFixed(6)+', '+q.lon.toFixed(6)+'</span><span>±'+q.acc.toFixed(0)+'m</span></div>').join('')
    :'<span class="mut">Stand on a corner and tap Record coordinate.</span>';
}
function record(){
  if(!navigator.geolocation){alert('GPS not available');return}
  const b=$('recbtn');b.disabled=true;b.textContent='Getting GPS fix…';
  navigator.geolocation.getCurrentPosition(pos=>{
    cur.points.push({lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy});
    b.disabled=false;b.textContent='Record coordinate';draw();
  },err=>{
    b.disabled=false;b.textContent='Record coordinate';
    alert('No GPS fix: '+err.message+'. Check location permission and try outdoors.');
  },{enableHighAccuracy:true,timeout:30000,maximumAge:0});
}
function undo(){cur.points.pop();draw()}
function save(){
  if(cur.points.length<3&&!confirm('Fewer than 3 points. Save anyway?'))return;
  cur.name=$('pname').value.trim()||('Parcel '+(parcels.length+1));
  cur.date=new Date().toLocaleString();
  parcels.push(cur);persist();cur=null;render();show('home');
}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
